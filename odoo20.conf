[options]
; --- Database (container Docker odoo20-db, port host 5433) ---
db_host = localhost
db_port = 5433
db_user = odoo
db_password = odoo
db_name = odoo20
dbfilter = odoo20

; --- Addons ---
addons_path = /home/ram/Documents/Odoo/odoo/addons,/home/ram/Documents/Odoo/custom-addons
data_dir = /home/ram/Documents/Odoo/odoo-data

; --- Server ---
http_port = 8069
proxy_mode = False
list_db = True
admin_passwd = CHANGE_ME_master_password
log_level = info

; --- Worker (dev: pakai jumlah kecil biar hemat) ---
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
